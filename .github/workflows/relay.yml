name: relay-manual

on:
  # 自動起動はminbreeder-sheetsへ移行。二重収集を防ぐ。
  workflow_dispatch: {}

concurrency:
  group: relay-hourly
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          OWNER: ryujin2023
          REPO: minbreeder-sheets
        run: |
          TS="$(date -u +%Y%m%d%H%M)"
          code=$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 30 -o dispatch-response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$OWNER/$REPO/dispatches \
            -d "{\"event_type\":\"hourly\",\"client_payload\":{\"ts\":\"$TS\"}}")
          test "$code" = "204" || { echo "Unexpected dispatch HTTP $code"; exit 1; }
          echo "dispatched manually ($TS) to $OWNER/$REPO"
