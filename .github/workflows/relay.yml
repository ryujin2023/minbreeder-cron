name: relay-hourly

on:
  # schedule:
    #- cron: "0 * * * *"      # 毎時
    #- cron: "*/5 * * * *"      # 毎時
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}   # ← このリポの Secrets に保存したPAT
          OWNER: ryujin2023                         # ← あなたのユーザ名
          REPO:  minbreeder-sheets                  # ← 本番リポ名
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$OWNER/$REPO/dispatches \
            -d '{"event_type":"hourly"}'
          echo "dispatched hourly to $OWNER/$REPO at $(date -u)"
