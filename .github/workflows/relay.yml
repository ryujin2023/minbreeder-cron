name: relay-hourly

on:
  schedule:
    - cron: "0 */3 * * *"    # 毎時（UTC）
  workflow_dispatch: {}

# ← 二重起動しても dispatch は常に1本だけになる
concurrency:
  group: relay-hourly
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          OWNER: ryujin2023
          REPO:  minbreeder-sheets
        run: |
          TS="$(date -u +%Y%m%d%H%M)"  # 送信識別子（同一分）
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$OWNER/$REPO/dispatches \
            -d "{\"event_type\":\"hourly\",\"client_payload\":{\"ts\":\"$TS\"}}"
          echo "dispatched hourly ($TS) to $OWNER/$REPO"
